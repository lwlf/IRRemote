name: Android CI Build IRRemote (No Source Modify)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # =====【重点调换顺序：先临时修改settings，再运行gradle】=====
      - name: Hot‑patch settings.gradle.kts (runtime only, only change runner copy)
        run: |
          sed -i 's/dependencyResolution {/dependencyResolutionManagement {/' settings.gradle.kts
          cat settings.gradle.kts

      - name: Install Gradle 8.7 on runner
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle Wrapper 8.7
        run: gradle wrapper --gradle-version=8.7

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ========== 编译 Debug APK app + examples ==========
      - name: Build Debug APKs
        run: ./gradlew :app:assembleDebug :examples:assembleDebug

      # ========== 上传产物 ==========
      - name: Upload app debug apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload examples debug apk
        uses: actions/upload-artifact@v4
        with:
          name: examples-debug-apk
          path: examples/build/outputs/apk/debug/*.apk
